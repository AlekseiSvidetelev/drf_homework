name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run flake8
        run: poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
          REDIS_URL: redis://redis:6379/0
          TEST_MODE: "True"
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{github.sha}} .

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{github.sha}}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH with explicit key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Check and create deployment directory with correct permissions
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Проверяем существование директории
            if [ ! -d "${{ secrets.DEPLOY_DIR }}" ]; then
              echo "Directory does not exist, creating..."
              sudo mkdir -p ${{ secrets.DEPLOY_DIR }}
            fi

            # Устанавливаем правильного владельца
            echo "Setting correct ownership..."
            sudo chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ${{ secrets.DEPLOY_DIR }}

            # Устанавливаем правильные права
            echo "Setting correct permissions..."
            sudo chmod 755 ${{ secrets.DEPLOY_DIR }}

            # Проверяем права доступа
            echo "Checking access rights..."
            ls -ld ${{ secrets.DEPLOY_DIR }}

            # Проверяем, может ли пользователь писать в директорию
            if touch ${{ secrets.DEPLOY_DIR }}/test_write 2>/dev/null; then
              echo "Write access: OK"
              rm ${{ secrets.DEPLOY_DIR }}/test_write
            else
              echo "No write access to directory"
              exit 1
            fi
          EOF

      - name: Copy project files to server
        run: |
          rsync -avz --exclude '__pycache__' --exclude '.env' -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/

      - name: Install Poetry on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Устанавливаем Poetry, если еще не установлен
            if ! command -v poetry &> /dev/null; then
              echo "Installing Poetry..."
              curl -sSL https://install.python-poetry.org | python3 -
              echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
              source ~/.bashrc
            else
              echo "Poetry is already installed"
            fi
          EOF

      - name: Install dependencies with Poetry on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            export PATH="$HOME/.local/bin:$PATH"
            poetry install --no-root
          EOF

      - name: Apply migrations on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            export PATH="$HOME/.local/bin:$PATH"
            poetry run python manage.py migrate
          EOF

      - name: Collect static files on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            export PATH="$HOME/.local/bin:$PATH"
            poetry run python manage.py collectstatic --noinput
          EOF

      - name: Restart application
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo systemctl restart myapp.service
          EOF
